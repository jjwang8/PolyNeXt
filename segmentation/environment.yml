# Conda environment for the PolyNeXt ADE20K segmentation experiments (Python 3.8).
#
# `conda env create -f environment.yml` reproduces the package versions, but this
# old mmseg / newer mmcv pairing may still need small source-level compatibility
# patches (see README.md). For a patched, ready-to-run setup, use the packed
# environment openmmlab.tar.gz from https://huggingface.co/JJWCactus/PolyNeXt.
